<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR-Code Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        /* Custom styles for the scanner overlay */
        #reader {
            width: 100%;
            border-radius: 0.75rem;
            overflow: hidden;
            background-color: #f3f4f6; /* bg-gray-100 */
        }
        #reader__dashboard_section_csr span {
            color: #374151; /* text-gray-700 */
            font-family: inherit;
        }
        #reader__dashboard_section_swaplink {
            color: #2563eb; /* text-blue-600 */
            text-decoration: underline;
        }
        #reader video {
            width: 100% !important;
            height: auto !important;
            border-radius: 0.75rem;
            object-fit: contain;
        }
        .scan-flash {
            animation: flashGreen 0.6s ease-out;
        }
        @keyframes flashGreen {
            0% { box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.8); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <header class="bg-white shadow-sm p-4 sticky top-0 z-10">
        <div class="max-w-5xl mx-auto flex items-center justify-between">
            <h1 class="text-2xl font-bold text-blue-600 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
                </svg>
                QR-Scanner
            </h1>
        </div>
    </header>

    <main class="flex-grow p-4 max-w-5xl mx-auto w-full grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- Scanner Section -->
        <section class="flex flex-col gap-4">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center">
                <div class="flex items-center justify-between w-full mb-3">
                    <h2 class="text-lg font-semibold text-slate-700">Kamera</h2>
                    <span id="status-toast" class="text-xs px-2.5 py-1 rounded-full opacity-0 transition-opacity font-medium"></span>
                </div>
                
                <select id="camera-select" class="hidden text-sm bg-slate-50 border border-slate-200 rounded-lg p-2 text-slate-700 w-full mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">Standard-Kamera (Automatisch)</option>
                </select>

                <!-- Placeholder / Scanner Container -->
                <div id="reader-container" class="w-full relative rounded-xl overflow-hidden border-2 border-dashed border-slate-300 min-h-[280px] flex items-center justify-center bg-slate-50 transition-all duration-200">
                    <div id="reader" class="w-full"></div>
                    <div id="scanner-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 p-6 text-center z-0">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mb-2 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        <p>Klicke auf "Scanner starten", um die Webcam zu aktivieren.</p>
                    </div>
                </div>

                <div class="mt-6 flex flex-wrap gap-3 w-full justify-center">
                    <button id="btn-start" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow-sm transition-colors w-full sm:w-auto">
                        Scanner starten
                    </button>
                    <button id="btn-stop" class="hidden px-6 py-2.5 bg-red-100 hover:bg-red-200 text-red-700 font-medium rounded-lg shadow-sm transition-colors w-full sm:w-auto">
                        Stoppen
                    </button>
                    <label for="qr-input-file" class="cursor-pointer px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-lg shadow-sm transition-colors flex items-center justify-center gap-2 w-full sm:w-auto">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        Foto / Datei wählen
                        <input type="file" id="qr-input-file" accept="image/*" class="hidden">
                    </label>
                </div>
            </div>
        </section>

        <!-- Results Section -->
        <section class="flex flex-col gap-4">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex-grow flex flex-col max-h-[80vh]">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-slate-700 flex items-center gap-2">
                        Gescannte Codes 
                        <span id="scan-count" class="bg-blue-100 text-blue-700 text-xs py-1 px-2.5 rounded-full font-bold">0</span>
                    </h2>
                    <button id="btn-clear" class="text-sm text-slate-500 hover:text-red-500 transition-colors">
                        Liste leeren
                    </button>
                </div>
                
                <!-- List Container -->
                <div class="flex-grow overflow-y-auto pr-2 custom-scrollbar">
                    <ul id="scanned-list" class="space-y-3">
                        <li id="empty-state" class="text-slate-400 text-center py-10 italic">
                            Noch keine QR-Codes gescannt.
                        </li>
                    </ul>
                </div>
            </div>
        </section>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- State Variables ---
            const scannedCodes = new Set(); // Verhindert Duplikate
            let html5QrCode = null;
            let isScanning = false;
            let toastTimeout = null;

            // --- DOM Elements ---
            const btnStart = document.getElementById('btn-start');
            const btnStop = document.getElementById('btn-stop');
            const btnClear = document.getElementById('btn-clear');
            const listContainer = document.getElementById('scanned-list');
            const emptyState = document.getElementById('empty-state');
            const scanCountEl = document.getElementById('scan-count');
            const placeholder = document.getElementById('scanner-placeholder');
            const cameraSelect = document.getElementById('camera-select');
            const statusToast = document.getElementById('status-toast');
            const readerContainer = document.getElementById('reader-container');

            // --- Initialize Scanner Object ---
            // Native BarcodeDetector aktivieren für drastisch höhere Erkennungsrate
            html5QrCode = new Html5Qrcode("reader", {
                experimentalFeatures: {
                    useBarCodeDetectorIfSupported: true
                },
                verbose: false
            });

            // Vorab verfügbare Kameras auflisten
            Html5Qrcode.getCameras().then(devices => {
                if (devices && devices.length > 0) {
                    cameraSelect.innerHTML = '';
                    devices.forEach((device, index) => {
                        const opt = document.createElement('option');
                        opt.value = device.id;
                        opt.textContent = device.label || `Kamera ${index + 1}`;
                        cameraSelect.appendChild(opt);
                    });
                    if (devices.length > 1) {
                        cameraSelect.classList.remove('hidden');
                    }
                }
            }).catch(() => {
                // Berechtigung noch nicht erteilt; wird nach erstem Start erneut versucht
            });

            // --- Feedback Functions ---
            const showFeedback = (message, type = "info") => {
                if (!statusToast) return;
                if (!message) {
                    statusToast.classList.add('opacity-0');
                    return;
                }
                statusToast.textContent = message;
                statusToast.className = `text-xs px-2.5 py-1 rounded-full font-medium transition-opacity duration-200 ${
                    type === "success" 
                        ? "bg-green-100 text-green-700" 
                        : type === "warning"
                        ? "bg-amber-100 text-amber-700"
                        : "bg-slate-100 text-slate-600"
                }`;
                statusToast.classList.remove('opacity-0');
                if (toastTimeout) clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    statusToast.classList.add('opacity-0');
                }, 2500);
            };

            const triggerScanFlash = () => {
                if (readerContainer) {
                    readerContainer.classList.remove('scan-flash');
                    void readerContainer.offsetWidth; // Trigger DOM reflow
                    readerContainer.classList.add('scan-flash');
                }
            };

            // --- Core Functions ---

            // Wird aufgerufen, wenn ein QR Code erfolgreich gelesen wurde
            const onScanSuccess = (decodedText, decodedResult) => {
                triggerScanFlash();
                if (!scannedCodes.has(decodedText)) {
                    scannedCodes.add(decodedText);
                    addScanToList(decodedText);
                    updateCount();
                    playSuccessSound();
                    showFeedback("Code erfasst!", "success");
                } else {
                    showFeedback("Code bereits in Liste", "warning");
                }
            };

            // Fügt einen neuen Eintrag in die HTML Liste ein
            const addScanToList = (text) => {
                if (emptyState) emptyState.style.display = 'none';

                const li = document.createElement('li');
                li.className = "bg-slate-50 p-4 rounded-xl border border-slate-200 shadow-sm flex items-start gap-3 animate-fade-in-down break-words";
                
                // Icon für Listeneintrag
                const iconDiv = document.createElement('div');
                iconDiv.className = "mt-1 flex-shrink-0 text-green-500";
                iconDiv.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" /></svg>`;
                
                // Text Inhalt
                const textDiv = document.createElement('div');
                textDiv.className = "text-slate-700 font-medium w-full overflow-hidden";
                
                // Erkennung ob es eine URL ist, um sie klickbar zu machen
                if (text.startsWith('http://') || text.startsWith('https://')) {
                    textDiv.innerHTML = `<a href="${text}" target="_blank" class="text-blue-600 hover:underline break-all">${text}</a>`;
                } else {
                    textDiv.textContent = text;
                    textDiv.className = "text-slate-700 font-medium break-all";
                }

                // Zeitstempel
                const timeDiv = document.createElement('div');
                const now = new Date();
                timeDiv.className = "text-xs text-slate-400 mt-1";
                timeDiv.textContent = now.toLocaleTimeString('de-DE');

                textDiv.appendChild(timeDiv);
                
                li.appendChild(iconDiv);
                li.appendChild(textDiv);

                // Oben in die Liste einfügen
                listContainer.insertBefore(li, listContainer.firstChild);
            };

            // Aktualisiert den Zähler in der UI
            const updateCount = () => {
                scanCountEl.textContent = scannedCodes.size;
            };

            // Kleines akustisches Feedback
            const playSuccessSound = () => {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    const ctx = new AudioContext();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                } catch(e) {
                    // Ignorieren falls blockiert
                }
            };

            // Scanner starten
            const startScanner = async () => {
                // Sicherheitscheck für mobile Browser (iOS Safari / Android Chrome)
                if (!window.isSecureContext && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                    alert("Kamerazugriff wird von mobilen Browsern nur über HTTPS erlaubt.\n\n👉 Starte den HTTPS-Server (python3 serve_https.py) oder nutze den Button 'Foto / Datei wählen'.");
                    return;
                }

                const config = { 
                    fps: 15,
                    disableFlip: false
                };
                
                const selectedCameraId = cameraSelect.value;
                const cameraConfig = selectedCameraId ? selectedCameraId : { facingMode: { ideal: "environment" } };

                try {
                    await html5QrCode.start(cameraConfig, config, onScanSuccess);
                    isScanning = true;
                    placeholder.style.display = 'none';
                    btnStart.classList.add('hidden');
                    btnStop.classList.remove('hidden');
                    showFeedback("Kamera aktiv – halte QR-Code ins Bild", "info");

                    // Gerätenamen nach Erlaubnis aktualisieren
                    Html5Qrcode.getCameras().then(devices => {
                        if (devices && devices.length > 1) {
                            const currentVal = cameraSelect.value;
                            cameraSelect.innerHTML = '';
                            devices.forEach((device, index) => {
                                const opt = document.createElement('option');
                                opt.value = device.id;
                                opt.textContent = device.label || `Kamera ${index + 1}`;
                                if (device.id === currentVal) opt.selected = true;
                                cameraSelect.appendChild(opt);
                            });
                            cameraSelect.classList.remove('hidden');
                        }
                    }).catch(() => {});
                } catch (err) {
                    console.error("Fehler beim Starten des Scanners: ", err);
                    alert("Kamera konnte nicht gestartet werden. Bitte überprüfe die Berechtigungen.");
                }
            };

            // Scanner stoppen
            const stopScanner = async () => {
                if (isScanning && html5QrCode) {
                    try {
                        await html5QrCode.stop();
                    } catch (err) {
                        console.error("Fehler beim Stoppen: ", err);
                    } finally {
                        isScanning = false;
                        placeholder.style.display = 'flex';
                        btnStart.classList.remove('hidden');
                        btnStop.classList.add('hidden');
                        showFeedback("", "info");
                    }
                }
            };

            // Liste leeren
            const clearList = () => {
                if(confirm("Möchtest du die gesamte Liste löschen?")) {
                    scannedCodes.clear();
                    updateCount();
                    listContainer.innerHTML = '';
                    listContainer.appendChild(emptyState);
                    emptyState.style.display = 'block';
                    showFeedback("Liste geleert", "info");
                }
            };

            // Foto / Datei Scan
            const fileInput = document.getElementById('qr-input-file');
            fileInput.addEventListener('change', async (e) => {
                if (!e.target.files || e.target.files.length === 0) return;
                const file = e.target.files[0];
                showFeedback("Analysiere Foto...", "info");
                try {
                    const decodedText = await html5QrCode.scanFile(file, true);
                    onScanSuccess(decodedText);
                } catch (err) {
                    console.warn("Kein QR-Code im Bild gefunden: ", err);
                    showFeedback("Kein QR-Code im Foto erkannt", "warning");
                } finally {
                    fileInput.value = '';
                }
            });

            // --- Event Listeners ---
            btnStart.addEventListener('click', startScanner);
            btnStop.addEventListener('click', stopScanner);
            btnClear.addEventListener('click', clearList);
            cameraSelect.addEventListener('change', async () => {
                if (isScanning) {
                    await stopScanner();
                    await startScanner();
                }
            });
        });
    </script>
    
    <style>
        /* Simple animation for newly added list items */
        @keyframes fadeInDown {
            0% {
                opacity: 0;
                transform: translateY(-10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-down {
            animation: fadeInDown 0.3s ease-out forwards;
        }
        
        /* Custom scrollbar for a cleaner look */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</body>
</html>
